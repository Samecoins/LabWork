<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Арсенал Времени</title>
    <script type="module" src="/src/main.js" defer></script>
  </head>
  <body class="bg-light text-dark">
    <div class="container py-4">
      <h1 class="text-center mb-4">
        Арсенал Времени <i class="bi bi-shield-lock"></i>
      </h1>

      <form id="addCardForm" class="row g-3">
        <div class="col-md-4">
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Название оружия"
            required
          />
        </div>
        <div class="col-md-4">
          <input
            type="text"
            class="form-control"
            id="desc"
            placeholder="Описание"
            required
          />
        </div>
        <div class="col-md-4">
          <select class="form-select" id="category" required>
            <option value="" selected disabled>Выберите категорию</option>
            <option value="Пистолет">Пистолет</option>
            <option value="Автомат">Автомат</option>
            <option value="Нож">Нож</option>
          </select>
        </div>
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-success">
            Добавить карточку <i class="bi bi-plus-circle"></i>
          </button>
        </div>
      </form>

      <hr class="my-4" />

      <div id="cardContainer" class="row gy-4"></div>
    </div>
  </body>
</html>

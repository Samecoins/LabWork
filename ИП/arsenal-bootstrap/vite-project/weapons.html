<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог оружия</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
  <script type="module" src="/src/pages/weapons.js" defer></script>

</head>
<body class="bg-light text-dark">

  <div class="container py-4">
    <h2 class="mb-4 text-center">Список оружия</h2>
    <div class="text-end mb-3">
      <a href="weapon-form.html" class="btn btn-success">
        Добавить оружие <i class="bi bi-plus-circle"></i>
      </a>


    </div>
    <div id="weapon-list" class="row g-3"></div>
  </div>

  <!-- Модальное окно редактирования -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editWeaponForm">
          <div class="modal-header">
            <h5 class="modal-title">Редактировать оружие</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label">Название</label>
              <input type="text" class="form-control" id="editName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Описание</label>
              <textarea class="form-control" id="editDesc" rows="3" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Категория</label>
              <select class="form-select" id="editCategory" required>
                <option value="Пистолет">Пистолет</option>
                <option value="Автомат">Автомат</option>
                <option value="Нож">Нож</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

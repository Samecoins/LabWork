<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Добавить оружие</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css" />
</head>
<body class="bg-light text-dark">
  <header class="bg-success text-white p-3 d-flex justify-content-between align-items-center flex-wrap">
  <h1 class="h3 m-0">Арсенал Времени</h1>
  <nav class="d-flex flex-wrap gap-2">
    <a href="weapons.html" class="btn btn-outline-light btn-sm">Список</a>
    <a href="weapon-form.html" class="btn btn-outline-light btn-sm">Добавить</a>
    <a href="catalog.html" class="btn btn-outline-light btn-sm">Каталог</a>
    <a href="stories.html" class="btn btn-outline-light btn-sm">Истории</a>
    <a href="services.html" class="btn btn-outline-light btn-sm">Услуги</a>
    <a href="contacts.html" class="btn btn-outline-light btn-sm">Контакты</a>
  </nav>
</header>

  <div class="container py-4">
    <h2 class="text-center mb-4">Добавление оружия</h2>

    <form id="weaponForm" class="row g-3">
      <div class="col-md-4">
        <input
          type="text"
          class="form-control"
          id="name"
          placeholder="Название оружия"
          required
        />
      </div>
      <div class="col-md-4">
        <input
          type="text"
          class="form-control"
          id="desc"
          placeholder="Описание"
          required
        />
      </div>
      <div class="col-md-4">
        <select class="form-select" id="category" required>
          <option value="" selected disabled>Выберите категорию</option>
          <option value="Пистолет">Пистолет</option>
          <option value="Автомат">Автомат</option>
          <option value="Нож">Нож</option>
        </select>
      </div>
      <div class="col-12 text-center">
        <button type="submit" class="btn btn-success">
          Сохранить <i class="bi bi-check-circle"></i>
        </button>
      </div>
    </form>
  </div>

  <script type="module" src="/src/pages/weapon-form.js"></script>
</body>
</html>

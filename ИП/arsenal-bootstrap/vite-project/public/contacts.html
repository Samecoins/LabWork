<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Контакты</title>
  <script type="module" src="/src/main.js" defer></script>
</head>
<body class="bg-light text-dark">
<header class="bg-success text-white p-3 d-flex justify-content-between align-items-center flex-wrap">
  <h1 class="h3 m-0">Арсенал Времени</h1>
  <nav class="d-flex flex-wrap gap-2">
    <a href="weapons.html" class="btn btn-outline-light btn-sm">Список</a>
    <a href="weapon-form.html" class="btn btn-outline-light btn-sm">Добавить</a>
    <a href="catalog.html" class="btn btn-outline-light btn-sm">Каталог</a>
    <a href="contacts.html" class="btn btn-outline-light btn-sm">Контакты</a>
    <a href="services.html" class="btn btn-outline-light btn-sm">Услуги</a>
    <a href="stories.html" class="btn btn-outline-light btn-sm">Истории</a>
  </nav>
</header>


  <main class="container py-4">
    <h2 class="mb-4 text-center">Контактная информация</h2>
    <p>г. Москва, ул. Ретрооружейная, д. 7</p>
    <p>Телефон: +7 (495) 123-45-67</p>
    <p>Email: info@arsenal-time.ru</p>

    <form class="mt-4">
      <div class="mb-3">
        <label for="name" class="form-label">Ваше имя</label>
        <input type="text" class="form-control" id="name" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Сообщение</label>
        <textarea class="form-control" id="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Отправить</button>
    </form>
  </main>
</body>
</html>
